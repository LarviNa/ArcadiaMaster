spring.application.name=ms-ventas

# Configuración del Puerto (8082 directo de ventas, 8083 si es a través de gateway)
server.port=${PORT:8082}
server.error.include-message=always
server.error.include-binding-errors=always

# Base de datos (H2 en memoria por defecto para ejecución directa sin Docker; MySQL configurable por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:h2:mem:arcadia_ventas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# =========================================================================
# CONFIGURACIÓN DE RABBITMQ (Spring AMQP / CloudAMQP / Docker)
# =========================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:${SPRING_RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${RABBITMQ_PORT:${SPRING_RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:${SPRING_RABBITMQ_USERNAME:guest}}
spring.rabbitmq.password=${RABBITMQ_PASS:${SPRING_RABBITMQ_PASSWORD:guest}}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${SPRING_RABBITMQ_ADDRESSES:}}

# Configuración del Listener y Reintentos hacia DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =========================================================================
# CONFIGURACIÓN DE CORREO ELECTRÓNICO (JavaMailSender / SMTP)
# Compatible con Mailtrap, Gmail u otro proveedor SMTP
# =========================================================================
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:fb3add333c003d}
spring.mail.password=${MAIL_PASS:e26bdfe96036dd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
arcadia.mail.from=${MAIL_FROM:ventas@arcadiacomics.cl}
