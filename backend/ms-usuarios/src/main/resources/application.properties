server.port=${PORT:8083}
spring.application.name=microservicio-usuarios
spring.main.allow-circular-references=true

# Base de datos (H2 en memoria por defecto para ejecución directa en EC2 sin Docker; MySQL si se define DB_HOST)
spring.datasource.url=${DB_URL:jdbc:h2:mem:arcadia_usuarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT (usando un valor por defecto para local)
jwt.secret=${JWT_SECRET:QXJjYWRpYVN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg5MCFBcmNhZGlhU2VjcmV0}
jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.arcadia.usuarios=INFO
logging.level.org.springframework.security=INFO

# Azure Entra ID (Microsoft) — JWKS público
azure.tenant-id=${AZURE_TENANT_ID:b06eec4f-9d74-498c-8a73-b5f5eec5479f}
azure.client-id=${AZURE_CLIENT_ID:55611909-8d64-41ee-90b6-2a89b026fd4e}
azure.audiences=${AZURE_AUDIENCE:api://55611909-8d64-41ee-90b6-2a89b026fd4e}
azure.admin-emails=${AZURE_ADMIN_EMAILS:}
azure.admin-groups=${AZURE_ADMIN_GROUPS:}

