server.port=${PORT:8085}
spring.application.name=microservicio-usuarios
spring.main.allow-circular-references=true

# Base de datos (MySQL por defecto en docker-compose, o variable de entorno DB_URL)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/arcadia_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT (usando un valor por defecto para local)
jwt.secret=${JWT_SECRET:QXJjYWRpYVN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg5MCFBcmNhZGlhU2VjcmV0}
jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.arcadia.usuarios=INFO
logging.level.org.springframework.security=INFO

# Azure Entra ID (Microsoft) — JWKS público
azure.tenant-id=${AZURE_TENANT_ID:b06eec4f-9d74-498c-8a73-b5f5eec5479f}
azure.client-id=${AZURE_CLIENT_ID:55611909-8d64-41ee-90b6-2a89b026fd4e}
azure.audiences=${AZURE_AUDIENCE:api://55611909-8d64-41ee-90b6-2a89b026fd4e}
azure.admin-emails=${AZURE_ADMIN_EMAILS:}
azure.admin-groups=${AZURE_ADMIN_GROUPS:}

