server.port=${PORT:8085}
spring.application.name=microservicio-usuarios
spring.main.allow-circular-references=true

# Base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:arcadia_usuarios}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (usando un valor por defecto para local)
jwt.secret=${JWT_SECRET:QXJjYWRpYVN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg5MCFBcmNhZGlhU2VjcmV0}
jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.arcadia.usuarios=INFO
logging.level.org.springframework.security=WARN

# Azure Entra ID (Microsoft) — JWKS público, no requiere credenciales en backend
# El tenant ID es opcional (se usa 'common' para multi-tenant por defecto)
azure.tenant-id=${AZURE_TENANT_ID:common}
